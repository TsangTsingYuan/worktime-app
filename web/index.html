<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="worktime_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>工作打卡</title>
  <link rel="manifest" href="manifest.json">
  <style>
    .loading-screen {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; background: #fafafa;
      font-family: -apple-system, sans-serif;
    }
    .loading-screen .spinner {
      width: 40px; height: 40px; margin-bottom: 24px;
      border: 4px solid #e0e0e0; border-top-color: #1976d2;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-screen p { color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <div class="loading-screen" id="loading">
    <div class="spinner"></div>
    <p>加载中...</p>
  </div>
  <script>
    (function() {
      var el = document.getElementById('loading');
      if (el) {
        // 最多显示30秒后自动隐藏
        setTimeout(function(){ el.style.display = 'none'; }, 30000);
      }
      window.addEventListener('flutter-first-frame', function() {
        if (el) el.style.display = 'none';
      });
    })();
  </script>
  <link rel="preload" href="sqlite3.wasm" as="fetch" crossorigin="anonymous">
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
